server:
  port: 8080
spring:
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/flashsale
    username: root
    password: ""
  data:
    redis:
      host: localhost
      port: 6379
mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    root: warn
    flashsale: info
